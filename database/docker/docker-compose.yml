version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - library_sql_data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - library-net

  circulation-service:
    build:
      context: ../../backend/circulation-service
      dockerfile: Dockerfile
    container_name: circulation-service
    ports:
      - "3004:3004"
    environment:
      DB_HOST: sqlserver        # Kết nối tới container sqlserver bằng tên service
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD} # Tái sử dụng biến từ file .env chung
      DB_NAME: LibraryDB
      PORT: 3004
      JWT_SECRET: change-this-secret-in-env
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - library-net

  api-gateway:
    build:
      context: ../../backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CIRCULATION_SERVICE_HOST: circulation-service # Kết nối TCP tới container circulation-service
      CIRCULATION_SERVICE_PORT: 3004
      JWT_SECRET: change-this-secret-in-env
    depends_on:
      - circulation-service
    restart: unless-stopped
    networks:
      - library-net

    
  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    env_file:
      - ../../backend/auth-service/.env
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: LibraryDB
      PORT: 3001
      JWT_SECRET: change-this-secret-in-env
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - library-net

  reader-service:
    build:
      context: ../../backend/reader-service
      dockerfile: Dockerfile
    container_name: reader-service
    ports:
      - "3003:3003"
    env_file:
      - ../../backend/reader-service/.env
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: LibraryDB
      PORT: 3003
      JWT_SECRET: change-this-secret-in-env
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - library-net
  
  catalog-service:
    build:
      context: ../../backend/catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "3002:3002"
    environment:
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: LibraryDB
      PORT: 3002
    depends_on:
      - sqlserver
    restart: unless-stopped
    networks:
      - library-net

volumes:
  library_sql_data:

networks:
  library-net:
    driver: bridge